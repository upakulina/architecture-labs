<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradebook System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f7f7f7;
      color: #222;
    }

    h1, h2 {
      margin-bottom: 12px;
    }

    button {
      padding: 10px 14px;
      margin: 8px 0;
      cursor: pointer;
    }

    input {
      display: block;
      margin: 8px 0;
      padding: 8px;
      width: 280px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    pre {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>Система рабочих ведомостей</h1>

  <div class="card">
    <h2>Список ведомостей</h2>
    <button onclick="loadGradebooks()">Загрузить ведомости</button>
    <pre id="gradebooks-output">Пока ничего не загружено</pre>
  </div>

  <div class="card">
    <h2>Добавить оценку в ведомость №1</h2>
    <input id="student_name" placeholder="ФИО студента" />
    <input id="control_name" placeholder="Элемент контроля" />
    <input id="score" type="number" step="0.1" min="0" max="10" placeholder="Оценка" />
    <button onclick="createGrade()">Добавить оценку</button>
    <pre id="create-grade-output">Результат появится здесь</pre>
  </div>

  <script src="./app.js"></script>
</body>
</html>
